# Render blueprint (New > Blueprint). Secrets are typed into Render, never committed.
services:
  - type: web
    name: mental-health-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd mental && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: cd mental && gunicorn mental.wsgi:application --workers 2 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: PIXABAY_KEY
        sync: false
      # Optional: set DATABASE_URL to a Postgres database to keep accounts between restarts.
      # Without it the app uses SQLite, which a free instance resets whenever it restarts.
